<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль</title>
    <link rel="stylesheet" href="profile.css">

</head>
<body>

    <div class="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <div class="profile-container">

        <div class="user-icon">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <span class="profile-title">Мой профиль</span>


        <button class="main-btn" onclick="openModal('account')">Управление аккаунтом</button>


        <button class="menu-btn" onclick="openModal('notifications')">Уведомления</button>
        <button class="menu-btn" onclick="openModal('dnd')">Не беспокоить</button>

        <div class="divider"></div>


        <button class="menu-btn" onclick="openModal('edit')">Аккаунт</button>
        <button class="menu-btn" onclick="openModal('theme')">Внешний вид</button>
        <button class="menu-btn" onclick="openModal('bookings')">Ближайшие поездки</button>
        <button class="menu-btn" onclick="openModal('favorites')">Избранное</button>
        <button class="menu-btn" onclick="openModal('reviews')">Отзывы</button>
        <button class="menu-btn" onclick="openModal('sent')">Отправленные сообщения</button>
        <button class="menu-btn" onclick="openModal('received')">Полученные сообщения</button>
    </div>


    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" id="modalContent">
            <h3 id="modalTitle">Заголовок</h3>
            <div id="modalBody"></div>
            <button class="modal-close" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>

        function openModal(title) {
            const overlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.textContent = title;


            let content = '';
            switch(title) {
                case 'Управление аккаунтом':
                    content = '<p>Здесь вы можете изменить настройки вашего аккаунта, обновить личную информацию и настроить безопасность.</p>';
                    content += '<div class="toggle-row"><span class="toggle-label">Email-уведомления</span><label class="toggle-switch"><input type="checkbox" checked><span class="toggle-slider"></span></label></div>';
                    content += '<div class="toggle-row"><span class="toggle-label">SMS-уведомления</span><label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label></div>';
                    content += '<div class="toggle-row"><span class="toggle-label">Push-уведомления</span><label class="toggle-switch"><input type="checkbox" checked><span class="toggle-slider"></span></label></div>';
                    break;
                case 'Уведомления':
                    content = '<p>Настройте предпочтения уведомлений. Вы можете выбирать, какие уведомления получать и каким образом.</p>';
                    content += '<div class="toggle-row"><span class="toggle-label">Акции и скидки</span><label class="toggle-switch"><input type="checkbox" checked><span class="toggle-slider"></span></label></div>';
                    content += '<div class="toggle-row"><span class="toggle-label">Новости</span><label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label></div>';
                    content += '<div class="toggle-row"><span class="toggle-label">Напоминания о поездках</span><label class="toggle-switch"><input type="checkbox" checked><span class="toggle-slider"></span></label></div>';
                    break;
                case 'Не беспокоить':
                    content = '<p>Включите режим "Не беспокоить", чтобы временно отключить все уведомления. Вы не будете получать оповещения в выбранное время.</p>';
                    content += '<div class="toggle-row"><span class="toggle-label">Активировать</span><label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label></div>';
                    break;
                case 'Аккаунт':
                    content = '<p>Управление данными вашего аккаунта. Вы можете изменить email, пароль и другие настройки безопасности.</p>';
                    content += '<div class="toggle-row"><span class="toggle-label">Двухфакторная аутентификация</span><label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label></div>';
                    break;
                case 'Внешний вид':
                    content = '<p>Настройте внешний вид приложения. Выберите тему, размер шрифта и другие визуальные параметры.</p>';
                    break;
                case 'Ближайшие поездки':
                    content = '<p>Здесь будут отображаться ваши предстоящие поездки. Пока у вас нет запланированных поездок.</p>';
                    break;
                case 'Избранное':
                    content = '<p>Сохранённые отели и направления, которые вам понравились. Добавьте что-нибудь в избранное, нажав на сердечко.</p>';
                    break;
                case 'Отзывы':
                    content = '<p>Ваши отзывы об отелях и экскурсиях. Спасибо, что делитесь впечатлениями!</p>';
                    break;
                case 'Отправленные сообщения':
                    content = '<p>История отправленных вами сообщений. Здесь вы можете найти все ваши предыдущие переписки.</p>';
                    break;
                case 'Полученные сообщения':
                    content = '<p>Полученные сообщения от поддержки и других пользователей. У вас нет новых сообщений.</p>';
                    break;
                default:
                    content = '<p>Раздел в разработке. Скоро здесь появится новая функциональность.</p>';
            }

            modalBody.innerHTML = content;
            overlay.classList.add('active');
        }

        function closeModal(event) {
            if (event && event.target !== document.getElementById('modalOverlay')) return;
            const overlay = document.getElementById('modalOverlay');
            overlay.classList.remove('active');
        }

        <button class="menu-btn" onclick="logout()" style="background: #ff4444; color: white; margin-top: 20px;">🚪 Выйти</button>

function logout() {
    localStorage.removeItem('token');
    window.location.href = '/entrance.html';
}
    </script>

<script src="auth.js"></script>
<script>
const modalData = {
account: { title:'Управление аккаунтом', body:'<p>Настройте аккаунт и безопасность.</p><div class="toggle-row"><span class="toggle-label">Email-уведомления</span><label class="toggle-switch"><input type="checkbox" checked><span class="toggle-slider"></span></label></div><div class="toggle-row"><span class="toggle-label">SMS-уведомления</span><label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label></div><div class="toggle-row"><span class="toggle-label">Push-уведомления</span><label class="toggle-switch"><input type="checkbox" checked><span class="toggle-slider"></span></label></div>' },
notifications: { title:'Уведомления', body:'<p>Настройте уведомления.</p><div class="toggle-row"><span class="toggle-label">Акции и скидки</span><label class="toggle-switch"><input type="checkbox" checked><span class="toggle-slider"></span></label></div><div class="toggle-row"><span class="toggle-label">Новости</span><label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label></div><div class="toggle-row"><span class="toggle-label">Напоминания о поездках</span><label class="toggle-switch"><input type="checkbox" checked><span class="toggle-slider"></span></label></div>' },
dnd: { title:'Не беспокоить', body:'<p>Режим тишины.</p><div class="toggle-row"><span class="toggle-label">Активировать</span><label class="toggle-switch"><input type="checkbox"><span class="toggle-slider"></span></label></div>' },
edit: { title:'Редактировать профиль', body:'<div style="display:flex;flex-direction:column;gap:12px;"><input id="editUsername" placeholder="Имя пользователя" style="padding:12px;border:1px solid #ddd;border-radius:8px;"><input id="editEmail" placeholder="Email" style="padding:12px;border:1px solid #ddd;border-radius:8px;"><input id="editCurrentPwd" type="password" placeholder="Текущий пароль" style="padding:12px;border:1px solid #ddd;border-radius:8px;"><input id="editNewPwd" type="password" placeholder="Новый пароль" style="padding:12px;border:1px solid #ddd;border-radius:8px;"><div id="editMsg" style="font-size:13px;min-height:18px;text-align:center;"></div><button onclick="saveProfile()" style="padding:12px;background:#38938B;color:#fff;border:none;border-radius:8px;">Сохранить</button></div>' },
bookings: { title:'Мои бронирования', body:'<div id="bookingsContent">Загрузка...</div>' },
favorites: { title:'Избранное', body:'<div id="favoritesContent">Загрузка...</div>' },
reviews: { title:'Отзывы', body:'<p>Раздел отзывов будет доступен после первого бронирования.</p>' },
sent: { title:'Отправленные сообщения', body:'<p>Сообщения пока отсутствуют.</p>' },
received: { title:'Полученные сообщения', body:'<p>Сообщения пока отсутствуют.</p>' },
theme: { title:'Внешний вид', body:'<p>Светлая тема активна. Темная тема будет добавлена в следующих версиях.</p>' }
};
function openModal(key){ const m=modalData[key]; document.getElementById('modalTitle').textContent=m.title; document.getElementById('modalBody').innerHTML=m.body; document.getElementById('modalOverlay').style.display='flex'; if(key==='bookings') loadBookings(); if(key==='favorites') loadFavorites(); if(key==='edit'){ const u=Auth.getUser()||{}; document.getElementById('editUsername').value=u.username||''; document.getElementById('editEmail').value=u.email||''; } }
function closeModal(e){ if(!e||e.target.id==='modalOverlay') document.getElementById('modalOverlay').style.display='none'; }
async function saveProfile(){ const payload={ username:document.getElementById('editUsername').value.trim(), email:document.getElementById('editEmail').value.trim(), currentPassword:document.getElementById('editCurrentPwd').value, newPassword:document.getElementById('editNewPwd').value }; const r=await Auth.apiRequest('/api/profile',{method:'PUT',body:JSON.stringify(payload)}); const el=document.getElementById('editMsg'); el.textContent=r.success?'Профиль обновлён':(r.error||'Ошибка'); el.style.color=r.success?'#38938B':'#e53935'; if(r.success){ const me=await Auth.apiRequest('/api/profile'); if(me.user){ localStorage.setItem('user',JSON.stringify(me.user)); document.querySelector('.profile-title').textContent=me.user.username; } } }
async function loadBookings(){ const r=await Auth.apiRequest('/api/bookings'); const c=document.getElementById('bookingsContent'); c.innerHTML=(r.bookings||[]).map(b=>`<div style="border:1px solid #eee;padding:12px;border-radius:10px;margin-bottom:10px;"><div style="font-weight:600;">${escapeHtml(b.title)}</div><div style="color:#777;font-size:13px;">${escapeHtml(b.location||'')}</div><div style="color:#777;font-size:13px;">${escapeHtml(b.check_in||'')} ${b.check_out? '— '+escapeHtml(b.check_out):''}</div><div style="margin-top:6px;color:#38938B;font-weight:600;">${Number(b.price||0).toLocaleString('ru')} ₽</div><button onclick="cancelBooking(${b.id})" style="margin-top:8px;border:1px solid #e53935;color:#e53935;background:#fff;padding:6px 10px;border-radius:6px;">Отменить</button></div>`).join('') || '<p>Нет бронирований</p>'; }
async function cancelBooking(id){ if(!confirm('Отменить бронирование?')) return; await Auth.apiRequest('/api/bookings/'+id,{method:'DELETE'}); loadBookings(); }
async function loadFavorites(){ const r=await Auth.apiRequest('/api/favorites'); const c=document.getElementById('favoritesContent'); c.innerHTML=(r.favorites||[]).map(f=>`<div style="border:1px solid #eee;padding:12px;border-radius:10px;margin-bottom:10px;"><div style="font-weight:600;">${escapeHtml(f.title)}</div><div style="color:#777;font-size:13px;">${escapeHtml(f.location||'')}</div><button onclick="removeFav('${f.item_type}','${f.item_id}')" style="margin-top:8px;border:1px solid #38938B;color:#38938B;background:#fff;padding:6px 10px;border-radius:6px;">Убрать</button></div>`).join('') || '<p>Нет избранного</p>'; }
async function removeFav(type,id){ await Auth.apiRequest('/api/favorites/'+type+'/'+id,{method:'DELETE'}); loadFavorites(); }
document.addEventListener('DOMContentLoaded',async()=>{ if(!Auth.isLoggedIn()){ sessionStorage.setItem('redirectAfterLogin','/profile.html'); location.href='/entrance.html'; return; } const me=await Auth.apiRequest('/api/profile'); if(me.user){ document.querySelector('.profile-title').textContent=me.user.username; document.querySelector('#profileEmail').textContent=me.user.email; document.getElementById('profileContainer').style.display='flex'; } });
function logout(){ Auth.logout(); }
</script>
</body>
</html>
